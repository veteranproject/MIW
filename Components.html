
<!-- =========================================================
     MIW MESSENGER V2
     REUSABLE UI COMPONENTS
========================================================== -->


<!-- =========================================================
     1. CONVERSATION ITEM
========================================================== -->

<template id="conversationTemplate">

  <button
    type="button"
    class="conversation-item"
    data-conversation-id=""
  >

    <div class="avatar avatar-medium">

      <img
        class="conversation-avatar hidden"
        alt=""
      >

      <span class="conversation-initial">C</span>

    </div>


    <div class="conversation-info">

      <div class="conversation-info-top">

        <strong class="conversation-name">
          Conversation
        </strong>

        <time class="conversation-time"></time>

      </div>


      <div class="conversation-info-bottom">

        <span class="conversation-preview">
          No messages yet
        </span>

        <span class="unread-count hidden"></span>

      </div>

    </div>

  </button>

</template>


<!-- =========================================================
     2. MESSAGE ITEM
========================================================== -->

<template id="messageTemplate">

  <div class="message-row">

    <div class="message-bubble">

      <div class="message-sender hidden"></div>


      <div class="message-reply hidden">

        <strong class="reply-sender"></strong>

        <p class="reply-body"></p>

      </div>


      <p class="message-body"></p>


      <div class="message-meta">

        <span class="message-edited hidden">
          edited
        </span>

        <time class="message-time"></time>

      </div>


      <div class="message-actions">

        <button
          type="button"
          class="message-action-button reply-message-action"
          data-action="reply"
        >
          Reply
        </button>


        <button
          type="button"
          class="message-action-button edit-message-action hidden"
          data-action="edit"
        >
          Edit
        </button>


        <button
          type="button"
          class="message-action-button delete-message-action hidden"
          data-action="delete"
        >
          Delete
        </button>

      </div>

    </div>

  </div>

</template>


<!-- =========================================================
     3. CONTACT ITEM
========================================================== -->

<template id="contactTemplate">

  <div
    class="entity-item contact-item"
    data-user-id=""
  >

    <div class="avatar avatar-medium">

      <img
        class="contact-avatar hidden"
        alt=""
      >

      <span class="contact-initial">U</span>

    </div>


    <div class="entity-item-info">

      <strong class="contact-name">
        User
      </strong>

      <span class="contact-miw-id">
        MIW-XXXX-XXXX-XXXX
      </span>

    </div>


    <button
      type="button"
      class="secondary-button contact-chat-button"
      data-action="chat"
    >
      Message
    </button>


    <button
      type="button"
      class="icon-button contact-more-button"
      data-action="more"
      aria-label="Contact options"
    >
      ⋯
    </button>

  </div>

</template>


<!-- =========================================================
     4. GROUP CARD
========================================================== -->

<template id="groupTemplate">

  <article
    class="entity-card group-card"
    data-conversation-id=""
  >

    <div class="avatar avatar-large">

      <span class="group-initial">
        G
      </span>

    </div>


    <h3 class="group-name">
      Group name
    </h3>


    <p class="group-description">
      Group conversation
    </p>


    <div class="entity-card-footer">

      <span class="group-member-count">
        0 members
      </span>


      <button
        type="button"
        class="secondary-button group-open-button"
        data-action="open"
      >
        Open chat
      </button>

    </div>

  </article>

</template>


<!-- =========================================================
     5. COMMUNITY CARD
========================================================== -->

<template id="communityTemplate">

  <article
    class="entity-card community-card"
    data-community-id=""
  >

    <div class="avatar avatar-large">

      <img
        class="community-avatar hidden"
        alt=""
      >

      <span class="community-initial">
        C
      </span>

    </div>


    <h3 class="community-name">
      Community name
    </h3>


    <p class="community-description">
      Community description
    </p>


    <div class="entity-card-footer">

      <span class="community-member-count">
        0 members
      </span>


      <span class="community-role">
        Member
      </span>

    </div>


    <button
      type="button"
      class="secondary-button community-open-button"
      data-action="open"
    >
      View community
    </button>

  </article>

</template>


<!-- =========================================================
     6. DRIVE FILE CARD
========================================================== -->

<template id="driveFileTemplate">

  <article
    class="drive-file-card"
    data-file-id=""
  >

    <div class="drive-file-icon">
      📄
    </div>


    <strong class="drive-file-name">
      document.pdf
    </strong>


    <span class="drive-file-size">
      0 KB
    </span>


    <div class="drive-file-actions">

      <button
        type="button"
        class="message-action-button drive-preview-button"
        data-action="preview"
      >
        Preview
      </button>


      <button
        type="button"
        class="message-action-button drive-download-button"
        data-action="download"
      >
        Download
      </button>


      <button
        type="button"
        class="message-action-button drive-delete-button"
        data-action="delete"
      >
        Delete
      </button>

    </div>

  </article>

</template>


<!-- =========================================================
     7. MESSAGE ATTACHMENT
========================================================== -->

<template id="attachmentTemplate">

  <div
    class="message-attachment"
    data-file-id=""
  >

    <div class="attachment-icon">

    </div>


    <div class="attachment-info">

      <strong class="attachment-name">
        attachment.pdf
      </strong>

      <span class="attachment-size">
        0 KB
      </span>

    </div>


    <button
      type="button"
      class="icon-button attachment-download-button"
      data-action="download"
      aria-label="Download attachment"
    >
      ↓
    </button>

  </div>

</template>
